services:
  - type: web
    name: sea-battle-server
    runtime: docker
    dockerfilePath: ./packages/server/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        value: "*"
    disk:
      name: sea-battle-db
      mountPath: /data
      sizeGB: 1
